name: Validate release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up application Node runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up offline worker tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install video test runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install locked application dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Test API ownership and callback security
        run: npm run test:api

      - name: Test worker attempts offline
        run: npm run test:worker

      - name: Test real URL rendering and signed downloads with local HTTP storage
        run: |
          python -m pip install 'supabase==2.34.1'
          npm run test:integration

      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/clip-jobs-test-runtime" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.15

      - name: Test migration execution, preservation, and rollback offline
        env:
          CLIP_JOBS_TEST_RUNTIME: ${{ runner.temp }}/clip-jobs-test-runtime
        run: node --test tests/clip-jobs-reconciliation.test.mjs tests/private-clips-storage.test.mjs

      - name: Build release without deploying
        run: npm run build
